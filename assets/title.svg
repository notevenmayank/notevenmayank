<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 170" width="100%" height="170">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.25" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .name {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.5px;
      fill: url(#textGrad);
    }
    .subtitle {
      font-family: 'Fira Code', Consolas, Monaco, monospace;
      font-size: 15px;
      font-weight: 500;
      fill: #cbd5e1;
    }
    .tag {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: #38bdf8;
    }
  </style>

  <!-- Card Background -->
  <rect width="848" height="168" x="1" y="1" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Wave Accent -->
  <path d="M 1 130 Q 220 90, 440 135 T 849 125 L 849 169 L 1 169 Z" fill="url(#waveGrad)" />

  <!-- Window Dots -->
  <circle cx="28" cy="24" r="5" fill="#ef4444" opacity="0.9" />
  <circle cx="44" cy="24" r="5" fill="#f59e0b" opacity="0.9" />
  <circle cx="60" cy="24" r="5" fill="#10b981" opacity="0.9" />


  <!-- Name -->
  <text x="50%" y="82" text-anchor="middle" class="name">Mayank Joshi</text>

  <!-- Subtitle -->
  <text x="50%" y="118" text-anchor="middle" class="subtitle">
    Full Stack Developer  •  AI &amp; Backend Systems  •  Creator of Sahayak Setu
  </text>
</svg>
